# MongoDB 7.0 — 单机 standalone（无复制集、无 keyFile）
#
# 用于：Linux 本机 / 普通开发机，不与 Mac 灾备组成 rs0。
# 复制集主库（WSL + Mac）请用 mongod.conf + mongodb/keyfile，见 mongodb/README.md

storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 6.0
      journalCompressor: snappy
    collectionConfig:
      blockCompressor: zstd
    indexConfig:
      prefixCompression: true

systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  verbosity: 0
  quiet: false
  timeStampFormat: iso8601-local

net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 500
  wireObjectCheck: true
  ipv6: false

security:
  authorization: enabled

operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 500
  slowOpSampleRate: 1.0

processManagement:
  timeZoneInfo: /usr/share/zoneinfo
