# MongoDB 6.0 — replica set Primary（115 扶正后，8GB 宿主机与同机业务共存）
# 配合 docker-compose.115.yml + docker-compose.115-primary.yml：容器 3GB，cache 1.5GB。

# ========================
# 存储配置
# ========================
storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1.5
      journalCompressor: snappy
    collectionConfig:
      blockCompressor: zstd
    indexConfig:
      prefixCompression: true

# ========================
# 日志配置（Docker：写到 data 卷，/var/log 在容器内不存在）
# ========================
systemLog:
  destination: file
  path: /data/db/mongod.log
  logAppend: true
  verbosity: 0
  quiet: false
  timeStampFormat: iso8601-local

# ========================
# 网络配置
# ========================
net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 200
  wireObjectCheck: true
  ipv6: false

# ========================
# 安全配置
# ========================
security:
  authorization: enabled
  keyFile: /etc/mongodb-keyfile

# ========================
# 性能分析
# ========================
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 500
  slowOpSampleRate: 1.0

# ========================
# 进程管理
# ========================
processManagement:
  timeZoneInfo: /usr/share/zoneinfo

# ========================
# 复制集
# ========================
replication:
  replSetName: rs0
