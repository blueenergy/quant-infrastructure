# 115 专用 override：同一 mongodb 服务，挂复制集配置 + 灾备资源限制。
# 新机器本地开发勿用此文件，保持 docker compose up -d mongodb 即可（单机 mongod.conf）。
#
# 启动:
#   docker compose -f docker-compose.yml -f docker-compose.115.yml up -d mongodb

services:
  mongodb:
    # Primary 为 6.0 时 Secondary 必须同大版本（7.0 拒绝 6.0 wire version 心跳）
    image: mongo:6.0
    volumes: !override
      - mongodb7_data:/data/db
      - mongodb7_config:/data/configdb
      - ./mongodb/mongod-replica.conf:/etc/mongod.conf:ro
      - ./mongodb/keyfile:/etc/mongodb-keyfile:ro
    mem_limit: 1536m
    mem_reservation: 384m
    cpus: "1.0"
    # Secondary 初始同步前无本地用户；勿用 admin 密码做 healthcheck
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  quant-network:
    external: true
