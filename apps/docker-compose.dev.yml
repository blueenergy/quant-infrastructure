# Local development stack (build from source). Production uses docker-compose.yml + deploy.sh.
name: quantfinance-dev

services:
  # 后端API服务
  quant-api:
    build:
      context: ../../quantFinance
      dockerfile: Dockerfile.backend
    container_name: quant-api
    ports:
      - "3001:3001"
    env_file:
      - path: ../../quantFinance/.env
        required: false
    environment:
      - MONGO_URI=${DOCKER_MONGO_URI:-mongodb://quant-mongodb:27017/}
      - DB_NAME=${MONGO_DB}
      - ANALYZER_DB_NAME=${ANALYZER_DB_NAME:-quant_analyzer}
      - REALTIME_DB_NAME=${REALTIME_DB_NAME:-quant_realtime}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REMOTE_WORKER_API=${REMOTE_WORKER_API:-http://quant-strategy-manager:5000/api/workers}
      - TZ=Asia/Shanghai
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - FROM_NAME=${FROM_NAME:-悟空量化}
      - PUBLIC_HOST=${PUBLIC_HOST:-}
      - USE_HTTPS=${USE_HTTPS:-false}
      # Hermes -> quant-api internal tools (连板天梯等); must match hermes service
      - HERMES_QUANT_INTERNAL_KEY=${HERMES_QUANT_INTERNAL_KEY:-}
      - BACKTEST_WORKER_TOKEN=${BACKTEST_WORKER_TOKEN:-}
      - ENABLE_EMBEDDED_SCHEDULER=false
      - ENABLE_MCP_SERVER=false
      - API_WORKERS=${API_WORKERS:-2}
      - PORTFOLIO_RESEARCH_REPORT_DIR=/app/reports/portfolio-research
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - quant-network
    volumes:
      - ../../shared/portfolio-research:/app/reports/portfolio-research
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # 只读 MCP 服务：查询行情/天梯/分析缓存，可按需水平扩容。
  quant-mcp:
    build:
      context: ../../quantFinance
      dockerfile: Dockerfile.backend
    container_name: quant-mcp-read
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "3002", "--workers", "1", "--log-level", "info" ]
    ports:
      - "3002:3002"
    env_file:
      - path: ../../quantFinance/.env
        required: false
    environment:
      - MONGO_URI=${DOCKER_MONGO_URI:-mongodb://quant-mongodb:27017/}
      - DB_NAME=${MONGO_DB}
      - ANALYZER_DB_NAME=${ANALYZER_DB_NAME:-quant_analyzer}
      - REALTIME_DB_NAME=${REALTIME_DB_NAME:-quant_realtime}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - TZ=Asia/Shanghai
      - HERMES_QUANT_INTERNAL_KEY=${HERMES_QUANT_INTERNAL_KEY:-}
      - ENABLE_EMBEDDED_SCHEDULER=false
      - ENABLE_MCP_SERVER=true
      - MCP_SERVER_MODE=read
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - quant-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3002/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # 动作 MCP 服务：提交分析任务、登录、自选股增删等有副作用操作。
  # 保持单 worker，避免 Streamable HTTP session 跨 worker 丢失。
  quant-mcp-actions:
    build:
      context: ../../quantFinance
      dockerfile: Dockerfile.backend
    container_name: quant-mcp-actions
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "3003", "--workers", "1", "--log-level", "info" ]
    ports:
      - "3003:3003"
    env_file:
      - path: ../../quantFinance/.env
        required: false
    environment:
      - MONGO_URI=${DOCKER_MONGO_URI:-mongodb://quant-mongodb:27017/}
      - DB_NAME=${MONGO_DB}
      - ANALYZER_DB_NAME=${ANALYZER_DB_NAME:-quant_analyzer}
      - REALTIME_DB_NAME=${REALTIME_DB_NAME:-quant_realtime}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - TZ=Asia/Shanghai
      - HERMES_QUANT_INTERNAL_KEY=${HERMES_QUANT_INTERNAL_KEY:-}
      - ENABLE_EMBEDDED_SCHEDULER=false
      - ENABLE_MCP_SERVER=true
      - MCP_SERVER_MODE=actions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - quant-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3003/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # 独立 APScheduler runner（单副本，不对外暴露端口）
  quant-scheduler:
    build:
      context: ../../quantFinance
      dockerfile: Dockerfile.backend
    container_name: quant-scheduler
    command: [ "python", "scheduler_runner.py" ]
    env_file:
      - path: ../../quantFinance/.env
        required: false
    environment:
      - MONGO_URI=${DOCKER_MONGO_URI:-mongodb://quant-mongodb:27017/}
      - DB_NAME=${MONGO_DB}
      - ANALYZER_DB_NAME=${ANALYZER_DB_NAME:-quant_analyzer}
      - REALTIME_DB_NAME=${REALTIME_DB_NAME:-quant_realtime}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - TZ=Asia/Shanghai
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - FROM_NAME=${FROM_NAME:-悟空量化}
      - SCHEDULER_LOCK_TTL_SECONDS=${SCHEDULER_LOCK_TTL_SECONDS:-90}
      - SCHEDULER_HEARTBEAT_INTERVAL_SECONDS=${SCHEDULER_HEARTBEAT_INTERVAL_SECONDS:-15}
      - SCHEDULER_RELOAD_INTERVAL_SECONDS=${SCHEDULER_RELOAD_INTERVAL_SECONDS:-15}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - quant-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "tools/check_scheduler_health.py" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Analysis workers — scale with: docker compose up --scale quant-analyzer=N
  # No container_name: required for --scale to work.
  # WORKER_ID defaults to the container hostname (unique per replica).
  quant-analyzer:
    build:
      context: ../../quantAnalyzer
      dockerfile: Dockerfile
    profiles: ["analyzer-local"]
    env_file:
      - path: ../../quantAnalyzer/.env
        required: false
    environment:
      - MONGO_URI=${DOCKER_MONGO_URI:-mongodb://quant-mongodb:27017/}
      - DB_NAME=${MONGO_DB}
      - ANALYZER_DB_NAME=${ANALYZER_DB_NAME:-quant_analyzer}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
      # LLM credentials are resolved from quantFinance users/admin config first.
      # Keep only the default provider env as a container-level fallback.
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-qwen}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-qwen-plus}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - QWEN_BASE_URL=${QWEN_BASE_URL}
      # ETF 分析是否传 response_format=json_object：on=与生产强制一致，auto=按模型名推断，off=关闭
      - ETF_ANALYSIS_RESPONSE_FORMAT=${ETF_ANALYSIS_RESPONSE_FORMAT:-auto}
      - LIMIT_UP_ATTRIBUTION_MODE=${LIMIT_UP_ATTRIBUTION_MODE:-legacy_daily}
      - LIMIT_UP_TRIGGER_MODE=${LIMIT_UP_TRIGGER_MODE:-scheduled}
      - ANALYSIS_INTERVAL=300
      - WORKER_ID=${HOSTNAME}
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - quant-network
    volumes:
      # Each replica writes to logs/analyzer-<WORKER_ID>.log, so multiple
      # replicas on the same host each get their own file — no conflicts.
      - ../../quantAnalyzer/logs:/app/logs
      - ../../quant-data-engine/src/quant_data_engine:/app/src/quant_data_engine
      - ../../quantAnalyzer/src:/app/src
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # 数据同步引擎 (每日定时任务)
  quant-data-engine:
    build:
      context: ../../quant-data-engine
      dockerfile: Dockerfile
    container_name: quant-data-engine
    profiles: ["data-engine-local"]
    env_file:
      - path: ../../quant-data-engine/.env
        required: false
    environment:
      # Use the compose-network MongoDB while service-specific settings live in ../quant-data-engine/.env.
      - MONGO_URI=${DOCKER_MONGO_URI:-mongodb://quant-mongodb:27017/}
      - MONGO_DB=${MONGO_DB}
      - DB_NAME=${MONGO_DB}
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - quant-network
    volumes:
      - ../../quant-data-engine/logs:/app/logs
      - ../../quant-data-engine/src/quant_data_engine:/app/src/quant_data_engine
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # 回测 Worker (轮询任务队列并执行回测，可水平扩展)
  backtest-worker:
    build:
      context: ../..
      dockerfile: backtest-worker/Dockerfile
    profiles: ["backtest-local"]
    env_file:
      - path: ../../backtest-worker/.env
        required: false
    environment:
      - MONGO_URI=${DOCKER_MONGO_URI:-mongodb://quant-mongodb:27017/}
      - DB_NAME=${MONGO_DB}
      - MONGO_DB=${DATA_DB_NAME:-quant_data}
      - BACKTEST_DB_NAME=${MONGO_DB:-finance}
      - BACKTEST_ROLE=worker
      # /deps is bind-mounted below, so reinstall over the baked-in packages.
      - BACKTEST_REINSTALL_DEPS=true
      - BACKTEST_WORKER_ID=${BACKTEST_WORKER_ID:-}
      - BACKTEST_POLL_INTERVAL=${BACKTEST_POLL_INTERVAL:-5}
      - BACKTEST_LEASE_SECONDS=${BACKTEST_LEASE_SECONDS:-300}
      - BACKTEST_HEARTBEAT_SECONDS=${BACKTEST_HEARTBEAT_SECONDS:-30}
      - LOG_LEVEL=INFO
      - ENABLE_SCREENING=false
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/backtest_worker_healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    volumes:
      - ../../backtest-worker/cache:/app/cache
      - ../../data-access-lib:/deps/data-access-lib
      - ../../quant-strategies:/deps/quant-strategies
    networks:
      - quant-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # 全市场筛选调度（单实例，与 queue worker 拆分）
  backtest-screening:
    build:
      context: ../..
      dockerfile: backtest-worker/Dockerfile
    container_name: backtest-screening
    profiles: ["backtest-local"]
    env_file:
      - path: ../../backtest-worker/.env
        required: false
    environment:
      - MONGO_URI=${DOCKER_MONGO_URI:-mongodb://quant-mongodb:27017/}
      - DB_NAME=${MONGO_DB}
      - MONGO_DB=${DATA_DB_NAME:-quant_data}
      - BACKTEST_DB_NAME=${MONGO_DB:-finance}
      - BACKTEST_ROLE=screening
      # /deps is bind-mounted below, so reinstall over the baked-in packages.
      - BACKTEST_REINSTALL_DEPS=true
      - BACKTEST_WORKER_ID=backtest-screening
      - ENABLE_SCREENING=false
      - SCREENING_MODE=${SCREENING_MODE:-conservative}
      - SCREENING_STRATEGIES=${SCREENING_STRATEGIES:-}
      - SCREENING_DAYS_BACK=${SCREENING_DAYS_BACK:-}
      - SCREENING_UNIVERSE_INDEX=${SCREENING_UNIVERSE_INDEX:-}
      - SCREENING_RUN_AT=${SCREENING_RUN_AT:-}
      - SCREENING_LOCK_TTL_SECONDS=${SCREENING_LOCK_TTL_SECONDS:-7200}
      - LOG_LEVEL=INFO
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ../../backtest-worker/cache:/app/cache
      - ../../data-access-lib:/deps/data-access-lib
      - ../../quant-strategies:/deps/quant-strategies
    networks:
      - quant-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # 模拟 quantTrader：Linux/dev 环境中用 fake xtquant 走真实 miniQMT broker 路径。
  # 显式启动：docker compose up -d --build quant-trader
  quant-trader:
    build:
      context: ../../quantTrader
      dockerfile: Dockerfile
    container_name: quant-trader
    env_file:
      - path: ../../quantTrader/.env
        required: false
    environment:
      - TRADER_MONGO_URI=${DOCKER_MONGO_URI:-mongodb://quant-mongodb:27017/}
      - TRADER_MONGO_DB=${MONGO_DB}
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - quant-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # 股票评分系统 (每日19:00定时评分)
  # Profile scorer-local: omit when QUANT_SCORER_RUNTIME=external_k8s.
  quant-scorer:
    build:
      context: ../../stock-scoring-system
      dockerfile: Dockerfile
    container_name: quant-scorer
    profiles: [ "scorer-local" ]
    command: [ "/app/start.scorer.sh" ]
    env_file:
      - path: ../../stock-scoring-system/.env
        required: false
    environment:
      - MONGO_URI=${DOCKER_MONGO_URI:-mongodb://quant-mongodb:27017/}
      - MONGO_DB=${MONGO_DB}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
      - MAX_WORKERS=${SCORING_MAX_WORKERS:-6}
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ../../stock-scoring-system/logs:/app/logs
    networks:
      - quant-network
    deploy:
      resources:
        limits:
          cpus: "${SCORER_CPU_LIMIT:-4}"
          memory: "${SCORER_MEM_LIMIT:-8g}"
        reservations:
          cpus: "1"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # 组合研究 worker (消费 portfolio research 任务队列)
  # Profile research-local: enable for local_docker runtime (default via
  # COMPOSE_PROFILES in apps/.env). Omit the profile when research runs on
  # external K8s — see apps/README "Portfolio research runtime".
  quant-researcher:
    build:
      context: ../../stock-scoring-system
      dockerfile: Dockerfile
    container_name: quant-researcher
    profiles: [ "research-local" ]
    command: [ "/app/start.researcher.sh" ]
    env_file:
      - path: ../../stock-scoring-system/.env
        required: false
    environment:
      - MONGO_URI=${DOCKER_MONGO_URI:-mongodb://quant-mongodb:27017/}
      - MONGO_DB=${MONGO_DB}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
      - MAX_WORKERS=${SCORING_MAX_WORKERS:-6}
      - TZ=Asia/Shanghai
      - PORTFOLIO_RESEARCH_REPORT_DIR=/app/reports/portfolio-research
      - PORTFOLIO_RESEARCH_RUNTIME=${PORTFOLIO_RESEARCH_RUNTIME:-local_docker}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ../../stock-scoring-system/logs/researcher:/app/logs
      - ../../shared/portfolio-research:/app/reports/portfolio-research
    networks:
      - quant-network
    deploy:
      resources:
        limits:
          cpus: "${RESEARCHER_CPU_LIMIT:-2}"
          memory: "${RESEARCHER_MEM_LIMIT:-18g}"
        reservations:
          cpus: "0"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # 因子回测 (Alpha158 筛选 loop)
  # 独立于 quant-researcher: 单个因子任务要跑 30~75 分钟并占用约 5GB,
  # 混在同一个 loop 里会把排在后面的组合研究任务全部堵死。
  quant-factor-researcher:
    build:
      context: ../../stock-scoring-system
      dockerfile: Dockerfile
    container_name: quant-factor-researcher
    profiles: [ "factor-research-local" ]
    command: [ "/app/start.factor-researcher.sh" ]
    env_file:
      - path: ../../stock-scoring-system/.env
        required: false
    environment:
      - MONGO_URI=${DOCKER_MONGO_URI:-mongodb://quant-mongodb:27017/}
      - MONGO_DB=${MONGO_DB}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
      - TZ=Asia/Shanghai
      # 报告只有 200KB 上下, 直接内联存 Mongo, 所以不需要报告卷。
      - FACTOR_BACKTEST_LOOP_LIMIT=${FACTOR_BACKTEST_LOOP_LIMIT:-1}
      # 诊断阶段单次调用要跑几十分钟, 阈值必须远高于健康任务的表现。
      - FACTOR_BACKTEST_STALE_MINUTES=${FACTOR_BACKTEST_STALE_MINUTES:-120}
      # 闸门是估算值, 所以刻意低于下面的 8g 上限, 留出估算误差的余量。
      - FACTOR_BACKTEST_MEMORY_BUDGET_GB=${FACTOR_BACKTEST_MEMORY_BUDGET_GB:-6}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ../../stock-scoring-system/logs/factor-researcher:/app/logs
    networks:
      - quant-network
    deploy:
      resources:
        limits:
          cpus: "${FACTOR_RESEARCHER_CPU_LIMIT:-2}"
          # 实测 CSI1000 x 158 因子峰值 RSS 4.2GB。
          memory: "${FACTOR_RESEARCHER_MEM_LIMIT:-8g}"
        reservations:
          cpus: "0"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # 组合计划生成 + paper-trading (计划生成 loop + 相关定时任务)
  quant-portfolio:
    build:
      context: ../../stock-scoring-system
      dockerfile: Dockerfile
    container_name: quant-portfolio
    profiles: ["portfolio-local"]
    command: [ "/app/start.portfolio.sh" ]
    env_file:
      - path: ../../stock-scoring-system/.env
        required: false
    environment:
      - MONGO_URI=${DOCKER_MONGO_URI:-mongodb://quant-mongodb:27017/}
      - MONGO_DB=${MONGO_DB}
      # Required by start.portfolio.sh for future trading-calendar lookups;
      # sibling scorer/researcher services already receive it.
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ../../stock-scoring-system/logs/portfolio:/app/logs
    networks:
      - quant-network
    deploy:
      resources:
        limits:
          cpus: "${PORTFOLIO_CPU_LIMIT:-1}"
          memory: "${PORTFOLIO_MEM_LIMIT:-512m}"
        reservations:
          cpus: "0"
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Strategy Manager API 服务
  quant-strategy-manager:
    build:
      context: ../..
      dockerfile: quant-strategy-manager/Dockerfile
    container_name: quant-strategy-manager
    ports:
      - "5001:5000"
    env_file:
      - path: ../../quant-strategy-manager/config/.env
        required: false
    environment:
      - MONGO_URI=${DOCKER_MONGO_URI:-mongodb://quant-mongodb:27017/}
      - MONGO_DB=${MONGO_DB}
      - API_PORT=5000
      - USE_NGINX_WEBSOCKET=${USE_NGINX_WEBSOCKET:-true}
      - PUBLIC_HOST=${PUBLIC_HOST}
      - USE_HTTPS=${USE_HTTPS:-false}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - quant-network
    volumes:
      - ../../quant-strategy-manager/logs:/app/quant-strategy-manager/logs
      - ../../vnpy-live-trading:/app/vnpy-live-trading
      - ../../data-access-lib:/app/data-access-lib
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # 前端Web服务
  quant-web:
    build:
      context: ../../quantFinance-dashboard
      dockerfile: Dockerfile.fast
      args:
        VITE_ASSISTANT_STREAM_BACKEND: hermes
    container_name: quant-web
    ports:
      - "8088:80"
      - "8443:443"
    restart: unless-stopped
    profiles: [ "frontend" ] # Optional: Only start with --profile frontend
    environment:
      - BACKEND_URL=http://quant-api:3001
      # Legacy/default MCP endpoint for /api/mcp. New MCP clients should prefer
      # MCP_READ_URL and MCP_ACTIONS_URL.
      - MCP_URL=http://quant-mcp:3002
      - MCP_READ_URL=http://quant-mcp:3002
      - MCP_ACTIONS_URL=http://quant-mcp-actions:3003
      # Nginx template still substitutes ASSISTANT_URL; chat uses Hermes via quant-api (/api/assistant/*).
      - ASSISTANT_URL=http://quant-api:3001
      - WS_WORKER_HOST=quant-strategy-manager
      - SSL_CERT=${SSL_CERT:-}
      - SSL_KEY=${SSL_KEY:-}
    networks:
      - quant-network
    volumes:
      - ../../quantFinance/ssl:/etc/nginx/ssl:ro # SSL证书目录
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  quant-network:
    external: true
    name: quant-network
