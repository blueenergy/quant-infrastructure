# ============================================================================
# Application stack — centralized CD (see apps/README.md).
#
# All services below are [MIGRATED]: reconciled to mirror each repo's previous
# GitHub CI `docker run` and deployed FROM HERE via deploy.sh. Image tags come
# from versions.env; runtime config/secrets come from per-service env/<svc>.env.
# If a future [UNVERIFIED] placeholder is added, do NOT deploy it from here
# until it is reconciled against that service's real deploy.
# ============================================================================
services:
  # [MIGRATED] Mirrors quantFinance CI deploy: quant-network, API port 3001,
  # extra_hosts, logs volume, portfolio-research shared volume, log rotation,
  # and shared env/common.env + service env/quant-api.env injected as process
  # environment (the image excludes .env, so no /app/.env bind mount is needed).
  # NOTE: quant-api / quant-mcp-read / quant-mcp-actions / quant-scheduler all
  # share the same quant-api image, so they share ${QUANT_API_IMAGE_TAG}.
  quant-api:
    image: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-api:${QUANT_API_IMAGE_TAG:-latest}
    container_name: quant-api
    restart: unless-stopped
    env_file:
      - env/common.env
      - env/quant-api.env
    environment:
      TZ: Asia/Shanghai
      ENABLE_EMBEDDED_SCHEDULER: "false"
      ENABLE_MCP_SERVER: "false"
      # API_WORKERS is intentionally NOT set here: an environment: entry would
      # override env_file and, since it can only interpolate from versions.env
      # (deploy.sh passes only --env-file versions.env), always resolve to the
      # default. Configure API_WORKERS in env/quant-api.env instead.
      PORTFOLIO_RESEARCH_REPORT_DIR: /app/reports/portfolio-research
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    volumes:
      - ./logs/quant-api:/app/logs
      - portfolio_research:/app/reports/portfolio-research
    networks:
      - quant-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # [MIGRATED] MCP read server. Stays behind the "mcp" profile so 115 can keep
  # it off (8GB + Mongo Primary). deploy.sh enables the profile everywhere else.
  quant-mcp-read:
    image: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-api:${QUANT_API_IMAGE_TAG:-latest}
    container_name: quant-mcp-read
    restart: unless-stopped
    profiles: ["mcp"]
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "3002", "--workers", "1", "--log-level", "info"]
    env_file:
      - env/common.env
      - env/quant-api.env
    environment:
      TZ: Asia/Shanghai
      ENABLE_EMBEDDED_SCHEDULER: "false"
      ENABLE_MCP_SERVER: "true"
      MCP_SERVER_MODE: read
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3002:3002"
    volumes:
      # REQUIRED: portfolio_research_result reads the full 324-row artifact from
      # disk (_load_full_result_rows). Without this mount it silently falls back
      # to Mongo's 200-row preview, which drops the worst performers and flips
      # axis_effects verdicts from mixed to *_dominates. Same volume as quant-api.
      - portfolio_research:/app/reports/portfolio-research
      - ./logs/quant-api:/app/logs
    networks:
      - quant-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # [MIGRATED] MCP actions server. Same "mcp" profile gate as quant-mcp-read.
  quant-mcp-actions:
    image: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-api:${QUANT_API_IMAGE_TAG:-latest}
    container_name: quant-mcp-actions
    restart: unless-stopped
    profiles: ["mcp"]
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "3003", "--workers", "1", "--log-level", "info"]
    env_file:
      - env/common.env
      - env/quant-api.env
    environment:
      TZ: Asia/Shanghai
      ENABLE_EMBEDDED_SCHEDULER: "false"
      ENABLE_MCP_SERVER: "true"
      MCP_SERVER_MODE: actions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3003:3003"
    volumes:
      - ./logs/quant-api:/app/logs
    networks:
      - quant-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3003/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # [MIGRATED] Mirrors quantFinance CI scheduler container. It is deployed
  # together with quant-api in v1. MCP is default-on via profile "mcp" except on 115.
  quant-scheduler:
    image: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-api:${QUANT_API_IMAGE_TAG:-latest}
    container_name: quant-scheduler
    restart: unless-stopped
    command: ["python", "scheduler_runner.py"]
    env_file:
      - env/common.env
      - env/quant-api.env
    environment:
      TZ: Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs/quant-api:/app/logs
    networks:
      - quant-net
    healthcheck:
      test: ["CMD-SHELL", "python tools/check_scheduler_health.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # [MIGRATED] Mirrors CI deploy: quant-network, HTTP/HTTPS ports, TLS cert
  # mount, and Nginx upstream env vars moved into env/quant-web.env.
  quant-web:
    image: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-dashboard:${QUANT_DASHBOARD_IMAGE_TAG:-latest}
    container_name: quant-web
    restart: unless-stopped
    env_file:
      - env/quant-web.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/nginx/cert:/etc/nginx/cert:ro
    networks:
      - quant-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # [MIGRATED] Scoring-only role from the stock-scoring-system image. Profile
  # scorer-local keeps the singleton scheduler on this host; omit it when
  # QUANT_SCORER_RUNTIME=external_k8s. Post-deploy DB maintenance runs once via
  # apps/hooks/quant-scorer-post.sh (ensure_portfolio_indexes +
  # seed_portfolio_param_presets).
  quant-scorer:
    image: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-scorer:${QUANT_SCORER_IMAGE_TAG:-latest}
    container_name: quant-scorer
    profiles: ["scorer-local"]
    restart: unless-stopped
    command: ["/app/start.scorer.sh"]
    env_file:
      - env/common.env
      - env/quant-scorer.env
    environment:
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs/quant-scorer:/app/logs
    networks:
      - quant-net
    # Resource limits come from the default below or docker-compose.115.yml;
    # common.env cannot set them (it is env_file, not compose interpolation):
    #   SCORER_CPU_LIMIT, SCORER_MEM_LIMIT
    # Defaults assume a 4-core host; raise for larger machines.
    # Local WSL2 host: 16 cores / 32G. 8g keeps long historical backfills
    # (analyzer data cache grows ~25MB/date) alive; 4g OOMs after ~110 dates.
    deploy:
      resources:
        limits:
          cpus: "${SCORER_CPU_LIMIT:-4}"
          memory: "${SCORER_MEM_LIMIT:-8g}"
        reservations:
          cpus: "1"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # [MIGRATED] Portfolio research role from the stock-scoring-system image.
  # It consumes research jobs and writes reports to the shared volume read by
  # quant-api. Profile research-local keeps it on this Compose host; omit the
  # profile (PORTFOLIO_RESEARCH_RUNTIME=external_k8s) when workers run in K8s.
  quant-researcher:
    image: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-scorer:${QUANT_SCORER_IMAGE_TAG:-latest}
    container_name: quant-researcher
    profiles: ["research-local"]
    restart: unless-stopped
    command: ["/app/start.researcher.sh"]
    env_file:
      - env/common.env
      - env/quant-scorer.env
    environment:
      - TZ=Asia/Shanghai
      - PORTFOLIO_RESEARCH_REPORT_DIR=/app/reports/portfolio-research
      - PORTFOLIO_RESEARCH_RUNTIME=${PORTFOLIO_RESEARCH_RUNTIME:-local_docker}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs/quant-researcher:/app/logs
      - portfolio_research:/app/reports/portfolio-research
    networks:
      - quant-net
    # Resource limits come from the default below or docker-compose.115.yml;
    # common.env cannot set them (it is env_file, not compose interpolation):
    #   RESEARCHER_CPU_LIMIT, RESEARCHER_MEM_LIMIT
    # Default caps sweep at half the host cores so scorer keeps headroom.
    # Local WSL2 host: a full-history csi1000 panel (~1.2M rows) sweeps past
    # 12g and gets OOM-killed mid-checkpoint; 18g matches production's 16GiB
    # headroom on this larger panel (verified 2026-08-28).
    deploy:
      resources:
        limits:
          cpus: "${RESEARCHER_CPU_LIMIT:-2}"
          memory: "${RESEARCHER_MEM_LIMIT:-18g}"
        reservations:
          cpus: "0"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Alpha158 factor backtest queue worker from the stock-scoring-system image.
  # Kept separate from quant-researcher because a single factor job runs
  # 30-75 minutes and peaks near 5GB: sharing that loop would block every
  # research job queued behind it. Set FACTOR_BACKTEST_RUNTIME=external_k8s
  # and stop this profile before running the K8s Deployment against the same
  # queue.
  quant-factor-researcher:
    image: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-scorer:${QUANT_SCORER_IMAGE_TAG:-latest}
    container_name: quant-factor-researcher
    profiles: ["factor-research-local"]
    restart: unless-stopped
    command: ["/app/start.factor-researcher.sh"]
    env_file:
      - env/common.env
      - env/quant-scorer.env
    environment:
      - TZ=Asia/Shanghai
      # Reports are ~200KB and stored inline in Mongo, so there is no report volume.
      - FACTOR_BACKTEST_LOOP_LIMIT=${FACTOR_BACKTEST_LOOP_LIMIT:-1}
      # The diagnostics stage runs tens of minutes inside one call, so the
      # stale threshold has to sit well above any healthy job.
      - FACTOR_BACKTEST_STALE_MINUTES=${FACTOR_BACKTEST_STALE_MINUTES:-120}
      # Deliberately under the memory limit below: the guard works off an
      # estimate, so it needs room for the estimate to be wrong.
      - FACTOR_BACKTEST_MEMORY_BUDGET_GB=${FACTOR_BACKTEST_MEMORY_BUDGET_GB:-6}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs/quant-factor-researcher:/app/logs
    networks:
      - quant-net
    # Resource limits come from the default below or docker-compose.115.yml;
    # common.env cannot set them (it is env_file, not compose interpolation):
    #   FACTOR_RESEARCHER_CPU_LIMIT, FACTOR_RESEARCHER_MEM_LIMIT
    # A CSI1000 x 158-factor run peaked at 4.2GB RSS, so the 8g default only
    # suits a host that is not also running Mongo. 115 caps this at 3g.
    deploy:
      resources:
        limits:
          cpus: "${FACTOR_RESEARCHER_CPU_LIMIT:-2}"
          memory: "${FACTOR_RESEARCHER_MEM_LIMIT:-8g}"
        reservations:
          cpus: "0"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # [MIGRATED] Portfolio planning and paper-trading role from the
  # stock-scoring-system image. It owns plan-generation polling and paper
  # execution/mark-to-market cron jobs.
  quant-portfolio:
    image: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-scorer:${QUANT_SCORER_IMAGE_TAG:-latest}
    container_name: quant-portfolio
    profiles: ["portfolio-local"]
    restart: unless-stopped
    command: ["/app/start.portfolio.sh"]
    env_file:
      - env/common.env
      # Includes TUSHARE_TOKEN; plan generation needs trade_cal for future execute_date.
      - env/quant-scorer.env
    environment:
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs/quant-portfolio:/app/logs
    networks:
      - quant-net
    # Resource limits come from the default below or docker-compose.115.yml;
    # common.env cannot set them (it is env_file, not compose interpolation):
    #   PORTFOLIO_CPU_LIMIT, PORTFOLIO_MEM_LIMIT
    # Plan generation loop and paper cron jobs are lightweight.
    deploy:
      resources:
        limits:
          cpus: "${PORTFOLIO_CPU_LIMIT:-1}"
          memory: "${PORTFOLIO_MEM_LIMIT:-512m}"
        reservations:
          cpus: "0"
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # [MIGRATED] Deployed via infra CD (deploy.sh). Mirrors the current CI deploy
  # faithfully: network_mode: host, logs volume + log rotation, layered env.
  # The DB is remote (another machine); MONGO_URI in common.env points there.
  # The image dockerignores .env, so config comes purely from injected env vars
  # (no /app/.env mount needed).
  quant-data-engine:
    image: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-data-engine:${QUANT_DATA_ENGINE_IMAGE_TAG:-latest}
    container_name: quant-data-engine
    profiles: ["data-engine-local"]
    restart: unless-stopped
    network_mode: host
    env_file:
      - env/common.env
      - env/quant-data-engine.env
    volumes:
      - ./logs/quant-data-engine:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # QMT realtime bridges, migrated off Windows (2026-10-10; see llm-wiki
  # daily/2026-10-10). Host network + WSL mirrored loopback = container reaches
  # the QMT RPC on Windows directly via 127.0.0.1:15609/15626. Configs are
  # machine-local runtime files (gitignored in quant-data-engine), mounted
  # read-only from the WSL checkout. quote-account-id CLI override pins the
  # 行情 instance until the JSONs themselves are aligned post-cutover.
  quant-realtime-dayk:
    image: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-data-engine:${QUANT_DATA_ENGINE_IMAGE_TAG:-latest}
    container_name: quant-realtime-dayk
    profiles: ["data-engine-local"]
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    command: >
      python3 scripts/run_miniqmt_bridge.py
      --config scripts/bigqmt_rpc_bridge.json
      --quote-account-id 8885156549
      --loop
    env_file:
      - env/common.env
      - env/quant-data-engine.env
    volumes:
      - /home/shuyolin/trading/quant-data-engine/scripts/bigqmt_rpc_bridge.json:/app/scripts/bigqmt_rpc_bridge.json:ro
      - ./logs/quant-realtime-dayk:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  quant-realtime-minute:
    image: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-data-engine:${QUANT_DATA_ENGINE_IMAGE_TAG:-latest}
    container_name: quant-realtime-minute
    profiles: ["data-engine-local"]
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    command: >
      python3 scripts/run_miniqmt_bridge.py
      --config scripts/bigqmt_rpc_bridge.watchlist_minute_kline.json
      --quote-account-id 8885156549
      --loop
    env_file:
      - env/common.env
      - env/quant-data-engine.env
    volumes:
      - /home/shuyolin/trading/quant-data-engine/scripts/bigqmt_rpc_bridge.watchlist_minute_kline.json:/app/scripts/bigqmt_rpc_bridge.watchlist_minute_kline.json:ro
      - ./logs/quant-realtime-minute:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # quantTrader 实盘下单端（大 QMT RPC 桥）。profile 门控 —— 不加 --profile 不会启动，
  # 恢复交易的决策与部署解耦（与 quant-realtime-* 同一套惯例）。
  #
  # 只用 quant-trader 镜像（Dockerfile.prod）：它不含 sim/，假 xtquant 不存在；
  # 模拟器是另一个镜像（quant-trader-sim），不要在这里用。
  #
  # 验证跑法（只读、不下单，不需要改挂载的配置）。注意 run 会自行带出 profile：
  #   docker compose --env-file versions.env -f docker-compose.yml \
  #     run --rm -e TRADER_QMT_BRIDGE_ALLOW_ORDERS=false quant-trader
  quant-trader:
    image: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-trader:${QUANT_TRADER_IMAGE_TAG:-latest}
    container_name: quant-trader
    profiles: ["trader-local"]
    restart: unless-stopped
    # QMT RPC 在 Windows loopback 上（mirrored 模式下容器内 127.0.0.1 即 Windows）；
    # 桥接网络下 127.0.0.1 是容器自己，连不上 15626。
    network_mode: host
    environment:
      # 14:55 收盘前强撤是 wall-clock 判据，容器时钟必须是本地时区
      - TZ=Asia/Shanghai
      # outbox 默认 fallback 到 LOCALAPPDATA/cwd，容器 recreate 会丢待上报队列
      - QUANT_TRADER_EXECUTION_OUTBOX_PATH=/app/data/execution_outbox.json
    volumes:
      # 交易配置（含 mongo_uri / 桥账号 / 端口），JSON 优先于 env —— 挂对文件是关键
      - /home/shuyolin/trading/quantTrader/config.qmt_bridge.json:/app/config/config.json:ro
      - ./data/quant-trader:/app/data
      - ./logs/quant-trader:/root/.local/share/quantTrader/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # [MIGRATED] Mirrors CI deploy: add-host for same-host API calls, cache
  # volume, log rotation, layered env.
  backtest-worker:
    image: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/backtest-worker:${BACKTEST_WORKER_IMAGE_TAG:-latest}
    profiles: ["backtest-local"]
    restart: unless-stopped
    env_file:
      - env/common.env
      - env/backtest-worker.env
    environment:
      TZ: Asia/Shanghai
      BACKTEST_ROLE: worker
      ENABLE_SCREENING: "false"
      BACKTEST_LEASE_SECONDS: "300"
      BACKTEST_HEARTBEAT_SECONDS: "30"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/backtest_worker_healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    volumes:
      - backtest_cache:/app/cache
    networks:
      - quant-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  backtest-screening:
    image: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/backtest-worker:${BACKTEST_WORKER_IMAGE_TAG:-latest}
    container_name: backtest-screening
    profiles: ["backtest-local"]
    restart: unless-stopped
    env_file:
      - env/common.env
      - env/backtest-worker.env
    environment:
      TZ: Asia/Shanghai
      BACKTEST_ROLE: screening
      BACKTEST_WORKER_ID: backtest-screening
      ENABLE_SCREENING: "false"
      SCREENING_MODE: conservative
      SCREENING_LOCK_TTL_SECONDS: "7200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backtest_cache:/app/cache
    networks:
      - quant-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # [MIGRATED] N replicas controlled by QUANT_ANALYZER_REPLICAS in versions.env
  # (default 4). deploy.sh reads that variable and passes --scale automatically,
  # so changing the replica count is a one-line edit in versions.env.
  # WORKER_ID is not set here; it falls back to the container hostname, which
  # is unique per scaled instance (see quantAnalyzer/src/.../main.py line 37).
  # The optional quant_data_engine source-code mount used in CI for debugging
  # is omitted — code ships in the image.
  quant-analyzer:
    image: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-analyzer:${QUANT_ANALYZER_IMAGE_TAG:-latest}
    profiles: ["analyzer-local"]
    restart: unless-stopped
    env_file:
      - env/common.env
      - env/quant-analyzer.env
    environment:
      TZ: Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs/quant-analyzer:/app/logs
    networks:
      - quant-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # [MIGRATED] Mirrors CI deploy: quant-network, extra_hosts, API port 5001:5000,
  # logs volume, log rotation, layered env. The old /home/deployuser/quantFinance/.env
  # file is replaced by common.env + quant-strategy-manager.env.
  quant-strategy-manager:
    image: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-strategy-manager:${QUANT_STRATEGY_MANAGER_IMAGE_TAG:-latest}
    container_name: quant-strategy-manager
    restart: unless-stopped
    env_file:
      - env/common.env
      - env/quant-strategy-manager.env
    environment:
      TZ: Asia/Shanghai
      API_PORT: "5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5001:5000"
    volumes:
      - ./logs/quant-strategy-manager:/app/quant-strategy-manager/logs
    networks:
      - quant-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  # Shared between quant-researcher and quant-api (portfolio research reports).
  portfolio_research:
    driver: local
  # backtest-worker job cache (strategy code, data frames, etc.)
  backtest_cache:
    driver: local

networks:
  quant-net:
    external: true
    # 指向 infra 创建的全局网络
    name: quant-network
