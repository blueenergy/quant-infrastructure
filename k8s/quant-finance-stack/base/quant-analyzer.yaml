# Standalone quant-analyzer worker (external_k8s).
#
#   K8S_NAMESPACE=aipoc ../deploy-quant-role.sh analyzer
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-analyzer
  labels:
    app: quant-analyzer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: quant-analyzer
  template:
    metadata:
      labels:
        app: quant-analyzer
    spec:
      containers:
        - name: analyzer
          image: quant-analyzer:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: quant-secrets
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MONGO_URI
            - name: MONGO_DB
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MONGO_DB
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MONGO_DB
            - name: DATA_DB_NAME
              value: quant_data
            - name: ANALYZER_DB_NAME
              value: quant_analyzer
            - name: ANALYSIS_INTERVAL
              value: "300"
            - name: DISABLE_AUTO_ANALYSIS
              value: "true"
            - name: DEFAULT_LLM_PROVIDER
              value: qwen
            - name: DEFAULT_MODEL
              value: qwen-plus
            - name: LIMIT_UP_ATTRIBUTION_MODE
              value: legacy_daily
            - name: LIMIT_UP_TRIGGER_MODE
              value: scheduled
            - name: ETF_ANALYSIS_RESPONSE_FORMAT
              value: auto
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: {}
