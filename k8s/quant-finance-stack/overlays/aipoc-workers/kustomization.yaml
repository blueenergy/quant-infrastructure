apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# GitOps overlay for NKS aipoc worker Deployments (Argo CD).
# Image tags are generated from apps/versions.env — run:
#   k8s/quant-finance-stack/scripts/sync-overlay-images.sh
namespace: aipoc

resources:
  - ../../base-workers

patches:
  - path: researcher-replicas-patch.yaml
  # Keep the cache producer revision identical to the immutable image tag.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: quant-researcher
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: quant-researcher
      spec:
        template:
          spec:
            containers:
              - name: researcher
                env:
                  - name: PORTFOLIO_RESEARCH_CACHE_V2_PRODUCER_REVISION
                    value: sha-90bc66a

labels:
  - pairs:
      app.kubernetes.io/part-of: quant-finance
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false

images:
  - name: quant-scorer:latest
    newName: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-scorer
    newTag: sha-90bc66a
  - name: quant-data-engine:latest
    newName: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-data-engine
    newTag: sha-4e6607d
  - name: backtest-worker:latest
    newName: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/backtest-worker
    newTag: sha-4a79462
  - name: quant-analyzer:latest
    newName: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-analyzer
    newTag: sha-06beabc
