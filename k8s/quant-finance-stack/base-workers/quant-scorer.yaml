# Standalone daily stock scorer (external_k8s).
# Run exactly one scheduler against a database: its flock is Pod-local and
# does not coordinate with a Compose scorer or another replica.
#
# Namespace and image are supplied by the deploy helper:
#
#   K8S_NAMESPACE=aipoc ../deploy-quant-role.sh scorer
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-scorer
  labels:
    app: quant-scorer
spec:
  replicas: 1
  strategy:
    # Avoid briefly running two cron schedulers during an image rollout.
    type: Recreate
  selector:
    matchLabels:
      app: quant-scorer
  template:
    metadata:
      labels:
        app: quant-scorer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scorer
          # Placeholder replaced by ../deploy-quant-role.sh scorer.
          image: quant-scorer:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/start.scorer.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: quant-secrets
          env:
            # Tushare persists its token at $HOME/tk.csv.
            - name: HOME
              value: /tmp
            - name: TZ
              value: Asia/Shanghai
            - name: DATA_DB_NAME
              value: quant_data
            # score_util.py uses this ThreadPool size for the daily run.
            - name: MAX_WORKERS
              value: "12"
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MONGO_URI
            - name: MONGO_DB
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MONGO_DB
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "12"
              memory: "16Gi"
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: {}
