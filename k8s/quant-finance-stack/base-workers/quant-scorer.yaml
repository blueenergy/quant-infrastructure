# Standalone daily stock scorer (external_k8s).
# Run exactly one scheduler against a database: its flock is Pod-local and
# does not coordinate with a Compose scorer or another replica.
#
# Namespace and image are supplied by the deploy helper:
#
#   K8S_NAMESPACE=aipoc ../deploy-quant-role.sh scorer
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-scorer
  labels:
    app: quant-scorer
spec:
  replicas: 1
  strategy:
    # Avoid briefly running two cron schedulers during an image rollout.
    type: Recreate
  selector:
    matchLabels:
      app: quant-scorer
  template:
    metadata:
      labels:
        app: quant-scorer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scorer
          # Placeholder replaced by ../deploy-quant-role.sh scorer.
          image: quant-scorer:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/start.scorer.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: quant-secrets
          env:
            # Tushare persists its token at $HOME/tk.csv.
            - name: HOME
              value: /tmp
            - name: TZ
              value: Asia/Shanghai
            - name: DATA_DB_NAME
              value: quant_data
            # stock_scores is a Cache Contract v2 source. Writer mutations must
            # fail closed if the finance revision ledger cannot be updated.
            - name: PORTFOLIO_RESEARCH_SOURCE_LEDGER_MODE
              value: "on"
            - name: PORTFOLIO_RESEARCH_SOURCE_LEDGER_TTL_SECONDS
              value: "900"
            - name: PORTFOLIO_RESEARCH_SOURCE_LEDGER_HEARTBEAT_SECONDS
              value: "60"
            - name: PORTFOLIO_RESEARCH_CACHE_V2_LEDGER_DB
              value: finance
            - name: PORTFOLIO_RESEARCH_CACHE_V2_LEDGER_COLLECTION
              value: portfolio_cache_source_revisions_v2
            - name: PORTFOLIO_RESEARCH_COVERAGE_AUDIT_STABILITY_SECONDS
              value: "60"
            - name: PORTFOLIO_RESEARCH_COVERAGE_AUDIT_TTL_HOURS
              value: "24"
            - name: PORTFOLIO_RESEARCH_COVERAGE_AUDIT_BY
              value: quant-scorer-cron
            # score_util.py uses this ThreadPool size for the daily run.
            - name: MAX_WORKERS
              value: "12"
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MONGO_URI
            - name: MONGO_DB
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MONGO_DB
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "12"
              memory: "16Gi"
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: audit-config
              mountPath: /app/crontab.scorer.txt
              subPath: crontab.scorer.txt
              readOnly: true
            - name: audit-config
              mountPath: /app/run-portfolio-cache-coverage-audit.sh
              subPath: run-portfolio-cache-coverage-audit.sh
              readOnly: true
      volumes:
        - name: logs
          emptyDir: {}
        - name: audit-config
          configMap:
            name: quant-scorer-audit-config
            defaultMode: 0555
