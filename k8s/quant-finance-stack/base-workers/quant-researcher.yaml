# Standalone portfolio research worker (external_k8s).
# Same stock-scoring-system image as Compose quant-researcher.
# Consumes quant_trading.portfolio_research_jobs via MONGO_URI in Secret
# "quant-secrets". Do not also run Compose profile research-local against
# the same Mongo queue (set PORTFOLIO_RESEARCH_RUNTIME=external_k8s).
#
# Namespace and image are rendered by the deploy helper:
#
#   K8S_NAMESPACE=aipoc ../deploy-quant-role.sh researcher
#
# Reports use emptyDir by default so clusters without working dynamic
# provisioning can still schedule. Re-add a PVC when StorageClass works.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-researcher
  labels:
    app: quant-researcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quant-researcher
  template:
    metadata:
      labels:
        app: quant-researcher
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: researcher
          # Placeholder replaced by ../deploy-quant-role.sh researcher.
          # Repository comes from QUANT_SCORER_IMAGE_REPOSITORY; tag comes
          # from apps/versions.env (QUANT_SCORER_IMAGE_TAG).
          image: quant-scorer:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/start.researcher.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: quant-secrets
          env:
            # uid 1000 has no passwd entry, so HOME would default to /, which
            # it cannot write. Tushare persists its token at $HOME/tk.csv.
            - name: HOME
              value: /tmp
            - name: TZ
              value: Asia/Shanghai
            - name: PORTFOLIO_RESEARCH_RUNTIME
              value: external_k8s
            - name: PORTFOLIO_RESEARCH_REPORT_DIR
              value: /app/reports/portfolio-research
            - name: PORTFOLIO_RESEARCH_CHECKPOINT_DIR
              value: /app/reports/portfolio-research/checkpoints
            - name: PORTFOLIO_RESEARCH_PANEL_CACHE_DIR
              value: /app/reports/portfolio-research/panel-cache
            # Cache Contract v2: S3 is the cross-Pod L2; the cache volume below
            # is a disposable per-Pod L1. S3 credentials come from the existing
            # quant-secrets envFrom above.
            - name: PORTFOLIO_RESEARCH_CACHE_V2_READ_MODE
              value: shadow
            - name: PORTFOLIO_RESEARCH_CACHE_V2_WRITE_MODE
              value: shadow
            - name: PORTFOLIO_RESEARCH_CACHE_V2_BACKEND
              value: s3
            - name: PORTFOLIO_RESEARCH_CACHE_V2_DIR
              value: /var/cache/portfolio-research/v2
            - name: PORTFOLIO_RESEARCH_CACHE_V2_L1_MAX_BYTES
              value: "21474836480"
            - name: PORTFOLIO_RESEARCH_CACHE_V2_L1_EVICT_RATIO
              value: "0.85"
            - name: PORTFOLIO_RESEARCH_CACHE_V2_PRODUCER_REVISION
              # deploy-quant-role.sh replaces this marker; the Argo overlay
              # patches it from apps/versions.env.
              value: "__QUANT_SCORER_IMAGE_TAG__"
            - name: PORTFOLIO_RESEARCH_CACHE_V2_S3_PREFIX
              value: portfolio-research/cache/v2
            - name: PORTFOLIO_RESEARCH_CACHE_V2_LEASE_TTL_SECONDS
              value: "180"
            - name: PORTFOLIO_RESEARCH_CACHE_V2_LEASE_RENEW_SECONDS
              value: "30"
            # A cold base-panel build was observed at ~985s. Followers wait
            # longer than that build and poll without hammering Mongo/S3.
            - name: PORTFOLIO_RESEARCH_CACHE_V2_BUILDER_WAIT_SECONDS
              value: "1200"
            - name: PORTFOLIO_RESEARCH_CACHE_V2_BUILDER_POLL_SECONDS
              value: "5"
            - name: PORTFOLIO_RESEARCH_CACHE_V2_LEDGER_COLLECTION
              value: portfolio_cache_source_revisions_v2
            - name: PORTFOLIO_RESEARCH_CACHE_V2_LEASE_COLLECTION
              value: portfolio_cache_leases_v2
            # Researcher only reads source revisions. Its Mongo principal needs
            # find on the ledger plus lease write access, but no source writes.
            - name: PORTFOLIO_RESEARCH_SOURCE_LEDGER_MODE
              value: "off"
            - name: PORTFOLIO_RESEARCH_CACHE_V2_LEDGER_DB
              value: finance
            # Outer sweep ProcessPool size per job; scale replicas for more jobs.
            # Each worker holds its own copy of the score panel, so peak memory
            # scales with workers x universe size. Six workers on a ~1000-name
            # universe needs the 48Gi limit below.
            - name: PORTFOLIO_RESEARCH_SWEEP_WORKERS
              value: "6"
            - name: PORTFOLIO_RESEARCH_LOOP_INTERVAL_SECONDS
              value: "5"
            - name: PORTFOLIO_RESEARCH_LOOP_LIMIT
              value: "2"
            - name: PORTFOLIO_RESEARCH_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MONGO_URI
            - name: MONGO_DB
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MONGO_DB
          volumeMounts:
            - name: reports
              mountPath: /app/reports/portfolio-research
            - name: cache
              mountPath: /var/cache/portfolio-research
            - name: logs
              mountPath: /app/logs
          resources:
            requests:
              # Request has to reserve most of the working set, not just a floor:
              # a 4Gi request against a 24Gi limit let the scheduler place this on
              # nodes without real headroom, and a csi1000 sweep grew until the
              # kubelet evicted the whole pod under node memory pressure.
              cpu: "500m"
              memory: "24Gi"
            limits:
              cpu: "2"
              memory: "48Gi"
      volumes:
        - name: reports
          emptyDir: {}
        - name: cache
          emptyDir:
            sizeLimit: 20Gi
        - name: logs
          emptyDir: {}
