# Standalone quant-data-engine (external_k8s). Singleton cron + sync loops.
#
#   K8S_NAMESPACE=aipoc ../deploy-quant-role.sh data-engine
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-data-engine
  labels:
    app: quant-data-engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: quant-data-engine
  template:
    metadata:
      labels:
        app: quant-data-engine
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: engine
          image: quant-data-engine:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: quant-secrets
          env:
            - name: HOME
              value: /tmp
            - name: TZ
              value: Asia/Shanghai
            - name: MONGO_DB
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MONGO_DB
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MONGO_DB
            - name: DATA_DB_NAME
              value: quant_data
            - name: REALTIME_DB_NAME
              value: quant_realtime
            - name: DEPLOY_MODE
              value: full
            - name: SECONDARY_MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: SECONDARY_MONGO_URI
                  optional: true
            - name: SECONDARY_MONGO_DB
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: SECONDARY_MONGO_DB
                  optional: true
            - name: INTRADAY_T0_TRIGGER_URL
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: INTRADAY_T0_TRIGGER_URL
            - name: INTRADAY_T0_TRIGGER_KEY
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: INTRADAY_T0_TRIGGER_KEY
            - name: MARKET_INSIGHT_TRIGGER_URL
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MARKET_INSIGHT_TRIGGER_URL
            - name: MARKET_INSIGHT_TRIGGER_KEY
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MARKET_INSIGHT_TRIGGER_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4"
              memory: "4Gi"
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: quant-data-engine-logs
