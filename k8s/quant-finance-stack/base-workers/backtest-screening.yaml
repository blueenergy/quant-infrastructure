# Singleton screening scheduler (external_k8s). Must not scale beyond one replica.
#
#   K8S_NAMESPACE=aipoc ../deploy-quant-role.sh backtest-screening
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtest-screening
  labels:
    app: backtest-screening
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backtest-screening
  template:
    metadata:
      labels:
        app: backtest-screening
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: screening
          image: backtest-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: quant-secrets
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: BACKTEST_ROLE
              value: screening
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MONGO_URI
            - name: MONGO_DB
              value: quant_data
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MONGO_DB
            - name: BACKTEST_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MONGO_DB
            - name: DATA_DB_NAME
              value: quant_data
            - name: BACKTEST_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ENABLE_SCREENING
              value: "false"
            - name: SCREENING_MODE
              value: conservative
            - name: SCREENING_LOCK_TTL_SECONDS
              value: "7200"
            - name: LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4"
              memory: "4Gi"
          volumeMounts:
            - name: cache
              mountPath: /app/cache
      volumes:
        - name: cache
          emptyDir: {}
