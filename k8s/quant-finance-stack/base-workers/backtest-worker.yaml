# Queue worker for backtest_tasks (external_k8s). Horizontally scalable.
#
#   K8S_NAMESPACE=aipoc K8S_REPLICAS=2 ../deploy-quant-role.sh backtest
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtest-worker
  labels:
    app: backtest-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backtest-worker
  template:
    metadata:
      labels:
        app: backtest-worker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: backtest-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: quant-secrets
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: BACKTEST_ROLE
              value: worker
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MONGO_URI
            - name: MONGO_DB
              value: quant_data
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MONGO_DB
            - name: BACKTEST_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MONGO_DB
            - name: DATA_DB_NAME
              value: quant_data
            - name: BACKTEST_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ENABLE_SCREENING
              value: "false"
            - name: LOG_LEVEL
              value: INFO
            - name: BACKTEST_POLL_INTERVAL
              value: "5"
            - name: BACKTEST_LEASE_SECONDS
              value: "300"
            - name: BACKTEST_HEARTBEAT_SECONDS
              value: "30"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4"
              memory: "4Gi"
          # The worker reaches its claim loop about 1s after container start now
          # that the image no longer reinstalls dependencies at boot. The old
          # 45s/20s delays were sized for that install and were the only reason
          # a pod took ~31s to report ready.
          livenessProbe:
            exec:
              command: ["test", "-f", "/tmp/backtest_worker_healthy"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/backtest_worker_healthy"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: cache
              mountPath: /app/cache
      volumes:
        - name: cache
          emptyDir: {}
