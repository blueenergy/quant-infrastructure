# Standalone backtest-worker (external_k8s). Single replica; screening must not duplicate.
#
#   K8S_NAMESPACE=aipoc ../deploy-quant-role.sh backtest
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtest-worker
  labels:
    app: backtest-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backtest-worker
  template:
    metadata:
      labels:
        app: backtest-worker
    spec:
      containers:
        - name: worker
          image: backtest-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: quant-secrets
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MONGO_URI
            - name: MONGO_DB
              value: quant_data
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MONGO_DB
            - name: BACKTEST_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: MONGO_DB
            - name: DATA_DB_NAME
              value: quant_data
            - name: BACKTEST_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ENABLE_SCREENING
              value: "true"
            - name: SCREENING_MODE
              value: conservative
            - name: LOG_LEVEL
              value: INFO
            - name: BACKTEST_POLL_INTERVAL
              value: "5"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4"
              memory: "4Gi"
          volumeMounts:
            - name: cache
              mountPath: /app/cache
      volumes:
        - name: cache
          emptyDir: {}
