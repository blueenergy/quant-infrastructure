name: Deploy app stack

# ============================================================================
# Centralized CD for the application stack (Push-style GitOps-lite).
#
# quant-infrastructure is the single source of truth: apps/versions.env holds
# the desired image tags and apps/docker-compose.yml the topology. App repos
# only do continuous DELIVERY (build + push image), then bump versions.env and
# notify this workflow; deployment happens here.
#
# Two delivery paths hang off versions.env: the Compose services roll out over
# SSH in the deploy job, and the K8s workers roll out through Argo CD, which
# watches the kustomize overlay. The sync-overlay job regenerates that overlay
# from versions.env and commits it, so an app CI tag bump reaches both without
# a manual step.
#
# Triggers:
#   - repository_dispatch (event_type: deploy): sent by app repos after they
#     bump versions.env. client_payload.services = space/comma separated list.
#   - workflow_dispatch: manual rollout or validation. `services` input
#     (blank = validate only / deploy all).
#
# Required secrets:
#   VOLC_SSH_KEY, VOLC_HOST, VOLC_USER, ALIYUN_USER, ALIYUN_TOKEN
# Optional repo variable:
#   INFRA_REMOTE_DIR (default: ~/trading/quant-infrastructure)
# ============================================================================

on:
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      services:
        description: "Services to deploy (space separated, blank = all)"
        required: false
        default: ""
  # NOTE: no push trigger — validate runs as part of every deploy (see the
  # validate job above), and it also keeps the sync-overlay job's own commit
  # from retriggering this workflow. To validate a manual infra edit without
  # deploying, use workflow_dispatch with a blank services input.

permissions:
  contents: read

jobs:
  validate:
    name: Validate compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render & validate compose
        working-directory: apps
        run: |
          # Materialize env files from examples so `config` can resolve every
          # service's env_file (real values are not needed for validation).
          mkdir -p env
          for ex in env/*.env.example; do
            [ -e "$ex" ] && cp "$ex" "${ex%.example}"
          done
          # Legacy single .env still referenced by not-yet-migrated services.
          touch .env
          docker compose --env-file versions.env config >/dev/null
          echo "compose config OK"

  sync-overlay:
    name: Sync Argo CD overlay image tags
    needs: [validate]
    runs-on: ubuntu-latest
    # The only job that writes to the repo; everything else stays read-only.
    permissions:
      contents: write
    concurrency:
      group: overlay-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Regenerate overlay from versions.env and commit any drift
        run: |
          # App CIs bump apps/versions.env but cannot regenerate the overlay,
          # so it used to arrive stale and fail the deploy. Sync it here
          # instead: Argo CD auto-syncs the K8s workers off this file, and the
          # SSH deploy job below pulls the commit for the Compose services.
          #
          # Pushing to main cannot retrigger this workflow — it has no push
          # trigger (see `on:` above).
          OVERLAY=k8s/quant-finance-stack/overlays/aipoc-workers/kustomization.yaml
          chmod +x k8s/quant-finance-stack/scripts/sync-overlay-images.sh
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --hard --quiet origin/main
            # Regenerating after the reset means a concurrent versions.env bump
            # is picked up rather than conflicted with.
            ./k8s/quant-finance-stack/scripts/sync-overlay-images.sh
            if git diff --quiet -- "$OVERLAY"; then
              echo "Overlay already matches apps/versions.env; nothing to commit."
              exit 0
            fi
            # Stage only the image tags. The replica patch the script also
            # writes comes from K8S_RESEARCHER_REPLICAS, which a CI checkout
            # does not have, so committing it here would reset it to the
            # default.
            git add "$OVERLAY"
            git commit -m "deploy(overlay): sync Argo CD image tags to versions.env"
            if git push origin main; then
              echo "Pushed overlay sync."
              exit 0
            fi
            echo "Push raced (attempt ${attempt}); retrying..."
            sleep $((attempt * 5))
          done
          echo "Failed to push overlay sync after retries." >&2
          exit 1

  deploy:
    name: Deploy to production
    # Only the event types that should actually roll out.
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    needs: [validate, sync-overlay]
    runs-on: ubuntu-latest
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    steps:
      - name: Resolve target services
        id: svc
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            SERVICES="${{ github.event.client_payload.services }}"
          else
            SERVICES="${{ github.event.inputs.services }}"
          fi
          # Normalize commas to spaces.
          SERVICES="$(echo "$SERVICES" | tr ',' ' ' | xargs || true)"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "Deploying services: '${SERVICES:-<all>}'"

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VOLC_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan "${{ secrets.VOLC_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        timeout-minutes: 30
        env:
          SERVICES: ${{ steps.svc.outputs.services }}
          INFRA_REMOTE_DIR: ${{ vars.INFRA_REMOTE_DIR || '~/trading/quant-infrastructure' }}
        run: |
          run_remote() {
            ssh -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              -o ConnectTimeout=30 \
              -o ConnectionAttempts=3 \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=6 \
              "${{ secrets.VOLC_USER }}@${{ secrets.VOLC_HOST }}" \
              "ALIYUN_USER='${{ secrets.ALIYUN_USER }}' \
               ALIYUN_TOKEN='${{ secrets.ALIYUN_TOKEN }}' \
               INFRA_REMOTE_DIR='${INFRA_REMOTE_DIR}' \
               SERVICES='${SERVICES}' bash -s" <<'EOF'
          set -euo pipefail
          cd "${INFRA_REMOTE_DIR/#\~/$HOME}"

          echo "[deploy] git pull desired state"
          git fetch --quiet origin main
          git checkout --quiet main
          git reset --hard --quiet origin/main

          echo "[deploy] running apps/deploy.sh ${SERVICES:-<all>}"
          chmod +x apps/deploy.sh
          ALIYUN_USER="$ALIYUN_USER" ALIYUN_TOKEN="$ALIYUN_TOKEN" \
            ./apps/deploy.sh ${SERVICES}
          EOF
          }

          for attempt in 1 2 3; do
            if run_remote; then exit 0; fi
            echo "Deploy attempt ${attempt} failed"
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 30))
          done
