name: Host maintenance

# ============================================================================
# Disk maintenance for the Compose production host.
#
# Why this exists: deploy.yml SSHes in, takes the host lock and then dies at
# `git fetch` with `fatal: write error: No space left on device`. The SSH path
# itself is fine -- only the target disk is full. That is a chicken-and-egg
# problem for a git-delivered fix, so the cleanup script here travels to the
# host over stdin (`bash -s <<'EOF'`), exactly like the deploy step does, and
# never needs to land on the filesystem first.
#
# Safe by construction:
#   - Volumes are NEVER touched (MongoDB lives in one) -- no `--volumes`, and
#     no `docker system prune`, which is one flag away from a data disaster.
#   - Images are only removed when no container references them, and only once
#     they are a week old, so a rollback target survives the run.
#   - Containers are only removed once they have been stopped for a day.
#
# Triggers: workflow_dispatch, plus the weekly schedule below. Never on push.
#
# How it reports: the run ends with a VERDICT section, and if the disk is still
# at or above DISK_ALERT_PCT once the cleanup has finished, that becomes a
# `::warning` line which the notify job turns into a DingTalk message. A cleanup
# that *ran* is not a disk that is *fine* -- 2026-10-16 is what that cost: the
# host sat at 100% for two days with every prune line green.
#
# Required secrets: VOLC_SSH_KEY, VOLC_HOST, VOLC_USER
# (Same set the deploy job uses. ALIYUN_* are not needed -- this pulls nothing.)
# Optional (warning → DingTalk; without them the warning stays in the log):
#   DATA_CONTRACT_WEBHOOK_URL, DATA_CONTRACT_WEBHOOK_SECRET
#
# Optional repo variable: INFRA_REMOTE_DIR (default: ~/trading/quant-infrastructure)
# ============================================================================

on:
  schedule:
    # Weekly safety net. apps/deploy.sh now prunes its own superseded images
    # (IMAGE_KEEP_HOURS, default 48), so in steady state this run finds little.
    # It is here for what the deploy path structurally cannot catch: a burst of
    # deploys that ages past its window, images pulled outside deploy.sh, or a
    # long stretch with no deploys at all. Sunday 19:17 UTC = Monday 03:17 CST,
    # clear of A-share hours.
    - cron: "17 19 * * 0"
  workflow_dispatch:
    inputs:
      image_age_hours:
        description: "Only prune unused images older than this many hours (168 = 1 week)"
        required: false
        default: "168"
      journal_keep:
        description: "Keep this much journald history (e.g. 200M)"
        required: false
        default: "200M"
      disk_alert_pct:
        description: "Warn if / is still at or above this % after the cleanup (85)"
        required: false
        default: "85"

permissions:
  contents: read

jobs:
  disk:
    name: Diagnose and reclaim disk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Threshold alerts the host raised (disk still tight after a full pass).
    # They do not fail this job -- see the notify job at the bottom.
    outputs:
      warnings: ${{ steps.warn.outputs.warnings }}
    env:
      IMAGE_AGE_HOURS: ${{ inputs.image_age_hours || '168' }}
      JOURNAL_KEEP: ${{ inputs.journal_keep || '200M' }}
      DISK_ALERT_PCT: ${{ inputs.disk_alert_pct || '85' }}
      INFRA_REMOTE_DIR: ${{ vars.INFRA_REMOTE_DIR || '~/trading/quant-infrastructure' }}
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VOLC_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Best-effort, same as the deploy job: StrictHostKeyChecking=no below
          # means a failed keyscan is not fatal.
          ssh-keyscan -T 10 "${{ secrets.VOLC_HOST }}" >> ~/.ssh/known_hosts \
            || echo "ssh-keyscan failed (non-fatal)"

      - name: Diagnose and reclaim
        id: reclaim
        timeout-minutes: 25
        run: |
          # Tee so the warning step below can read what the host reported while
          # the log still streams live, and pipefail so a dead SSH connection
          # stays a failed step instead of becoming a silent one.
          set -o pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=3 \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "${{ secrets.VOLC_USER }}@${{ secrets.VOLC_HOST }}" \
            "IMAGE_AGE_HOURS='${IMAGE_AGE_HOURS}' \
             JOURNAL_KEEP='${JOURNAL_KEEP}' \
             DISK_ALERT_PCT='${DISK_ALERT_PCT}' \
             INFRA_REMOTE_DIR='${INFRA_REMOTE_DIR}' bash -s" <<'EOF' 2>&1 \
            | tee "$RUNNER_TEMP/reclaim.log"
          set -uo pipefail
          # Re-apply the defaults here, not only in the workflow env: on a
          # `schedule` event the `inputs` context is unset, so an empty
          # IMAGE_AGE_HOURS would reach us and `--filter "until=h"` would fail
          # silently. Cheap insurance against the whole class.
          IMAGE_AGE_HOURS="${IMAGE_AGE_HOURS:-168}"
          JOURNAL_KEEP="${JOURNAL_KEEP:-200M}"
          DISK_ALERT_PCT="${DISK_ALERT_PCT:-85}"
          # Deliberately NOT `set -e`: the whole point of this run is that the
          # disk is full, so individual probes and prunes may fail. Each step
          # reports for itself and the run continues to the end -- a partial
          # cleanup that we can read is worth more than an early abort.

          echo "===== BEFORE ====="
          df -h / /var/lib/docker 2>/dev/null || df -h /
          echo
          echo "----- inodes -----"
          df -i / | tail -2
          echo
          echo "----- docker system df -----"
          docker system df 2>&1 || echo "  (docker unavailable)"
          echo
          echo "----- /var/lib/docker breakdown -----"
          sudo -n du -xsh /var/lib/docker/* 2>/dev/null | sort -rh | head -12 \
            || du -xsh /var/lib/docker/* 2>/dev/null | sort -rh | head -12 \
            || echo "  (cannot read /var/lib/docker without sudo)"
          echo
          echo "----- \$HOME breakdown -----"
          du -xsh "$HOME"/* 2>/dev/null | sort -rh | head -12
          echo
          echo "----- counts -----"
          images_before="$(docker images -q 2>/dev/null | wc -l)"
          echo "images    : ${images_before}"
          echo "containers: $(docker ps -aq 2>/dev/null | wc -l) total, $(docker ps -q 2>/dev/null | wc -l) running"
          echo "volumes   : $(docker volume ls -q 2>/dev/null | wc -l)  (NEVER touched by this run)"
          echo
          echo "----- biggest container json logs -----"
          sudo -n find /var/lib/docker/containers -name '*-json.log' -size +50M \
            -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -10 \
            || echo "  (needs sudo; compose caps these at 50m x 3 anyway)"
          echo
          echo "===== CLEANUP ====="
          echo "[1/5] dangling images"
          docker image prune -f 2>&1 | tail -3
          echo "[2/5] build cache"
          docker builder prune -f 2>&1 | tail -3
          echo "[3/5] containers stopped for over 24h"
          docker container prune -f --filter "until=24h" 2>&1 | tail -3
          echo "[4/5] journald (keep ${JOURNAL_KEEP})"
          sudo -n journalctl --vacuum-size="${JOURNAL_KEEP}" 2>&1 | tail -3 \
            || journalctl --vacuum-size="${JOURNAL_KEEP}" 2>&1 | tail -3 \
            || echo "  (skipped: needs privileges)"
          echo "[5/5] unused images older than ${IMAGE_AGE_HOURS}h"
          echo "      (images a running container uses are never candidates)"
          docker image prune -a -f --filter "until=${IMAGE_AGE_HOURS}h" 2>&1 | tail -5
          echo
          echo "===== AFTER ====="
          df -h / /var/lib/docker 2>/dev/null || df -h /
          echo
          docker system df 2>&1 || true
          echo
          echo "===== still running ====="
          docker ps --format '{{.Names}}\t{{.Image}}\t{{.Status}}' | sort
          echo
          echo "===== VERDICT ====="
          images_after="$(docker images -q 2>/dev/null | wc -l)"
          used_pct="$(df --output=pcent / 2>/dev/null | tail -1 | tr -dc '0-9' || true)"
          echo "images: ${images_before} -> ${images_after}"
          echo "disk  : ${used_pct:-?}% used (alert threshold ${DISK_ALERT_PCT}%)"
          # Deliberately NOT "the run freed nothing": in steady state a weekly
          # pass legitimately finds little, and a robot that cries wolf every
          # Sunday is a robot nobody reads (see the 2026-10-16 note: the failure
          # alarm fired for four days and changed nothing).
          # What is worth a page is a *finished* cleanup that left the disk tight
          # anyway -- the space is then held by something a deploy must not touch,
          # and the next `No space left on device` is one week away.
          if [ "${used_pct:-0}" -ge "${DISK_ALERT_PCT}" ]; then
            echo "::warning title=disk still tight on $(hostname)::/ is still ${used_pct}% used after a full cleanup pass (images ${images_before} -> ${images_after}, image age window ${IMAGE_AGE_HOURS}h); the space is held by something this workflow will not remove -- read the breakdown above"
          fi
          EOF

      - name: Collect host warnings
        id: warn
        # Reads what the host reported, separately from the run itself, so the
        # verdict survives even when the reclaim step ends red.
        if: always()
        run: |
          log="$RUNNER_TEMP/reclaim.log"
          [ -s "$log" ] || { echo "no run log"; exit 0; }
          # The host emits `::warning title=<t>::<text>` (the runner renders those
          # as annotations too); strip the command so the DingTalk message reads
          # as a sentence rather than as workflow syntax.
          warnings="$(grep -E '^::warning title=' "$log" \
            | sed -E 's/^::warning title=([^:]*)::/- [\1] /' || true)"
          [ -n "$warnings" ] || { echo "no host warnings"; exit 0; }
          echo "$warnings"
          { echo "warnings<<WARN_EOF"; echo "$warnings"; echo "WARN_EOF"; } >> "$GITHUB_OUTPUT"

  notify-dingtalk:
    name: Notify DingTalk
    # Two different things page here and only one of them is a failure. A run
    # that dies (SSH down, stuck lock) used to be entirely silent: this workflow
    # is manual + weekly, so nothing else was watching it. A run that finishes
    # with the disk still tight is the 2026-10-16 shape, one week early.
    if: ${{ always() && (needs.disk.result == 'failure' || needs.disk.result == 'cancelled' || needs.disk.outputs.warnings != '') }}
    needs: [disk]
    uses: ./.github/workflows/notify-dingtalk.yml
    secrets:
      DATA_CONTRACT_WEBHOOK_URL: ${{ secrets.DATA_CONTRACT_WEBHOOK_URL }}
      DATA_CONTRACT_WEBHOOK_SECRET: ${{ secrets.DATA_CONTRACT_WEBHOOK_SECRET }}
    with:
      workflow: ${{ github.workflow }}
      needs_json: ${{ toJSON(needs) }}
      alert_title: "宿主机告警 ${{ github.repository }}"
      # Only a *successful* run turns collected warnings into the message; a
      # failed one keeps the failure payload, which names the jobs that died.
      alert_text: ${{ needs.disk.result == 'success' && needs.disk.outputs.warnings || '' }}
